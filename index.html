
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTracker AI - 智能订阅管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
        }
        #root:empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #root:empty::after {
            content: '正在连接智能账单引擎...';
            color: #6366f1;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "modern-screenshot": "https://esm.sh/modern-screenshot@4.4.35?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script>
        window.addEventListener('error', function(e) {
            const root = document.getElementById('root');
            if (root && root.innerHTML === '') {
                root.innerHTML = `
                    <div style="padding: 40px; text-align: center; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white;">
                        <div style="background: #fdf2f2; border: 1px solid #fee2e2; padding: 32px; border-radius: 32px; max-width: 450px; box-shadow: 0 10px 15px rgba(0,0,0,0.05);">
                            <h2 style="color: #991b1b; margin-bottom: 12px; font-weight: 800;">启动受阻</h2>
                            <p style="color: #b91c1c; font-size: 14px; line-height: 1.6;">模块加载失败。这通常是由于网络连接问题，请尝试刷新页面。</p>
                            <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: center;">
                                <button onclick="location.reload(true)" style="padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;">强制刷新</button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }, true);
    </script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
